// Twin of OracleMods in dev/oracle-mods.gradle: applied scripts do not share
// top-level classes, so shard actions need their own copy. Keep both in sync,
// including the CDN fallback and the bounded 5xx retry below.
class OracleRunnerMods {
    // ponytail: per-JVM memo keyed by (path, size, mtime); oracle jars are immutable downloads.
    static final Map<String, String> hashCache = new java.util.concurrent.ConcurrentHashMap<>()
    static final String MIRROR = 'https://github.com/Blockfield/blockfield-pack-mirror/releases/download/files/'
    static final String CDN_MIRROR = 'https://r2.blockfield.pro/'

    static String hash(File file, String algorithm) {
        def key = algorithm + '|' + file.absolutePath + '|' + file.length() + '|' + file.lastModified()
        def hit = hashCache.get(key)
        if (hit != null) return hit
        def digest = java.security.MessageDigest.getInstance(algorithm)
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) { digest.update(buffer, 0, count) }
        }
        def value = digest.digest().encodeHex().toString()
        hashCache.put(key, value)
        return value
    }

    static File resolve(Map pins, File projectRoot, File modDir, Map unavailable, String name) {
        if (unavailable.containsKey(name)) return null
        def pin = pins[name]
        if (pin == null) throw new GradleException("No oracle pack pin: ${name}")
        def candidates = [new File(modDir, name)]
        def parent = projectRoot.toPath()
        while (parent != null) {
            candidates.add(parent.resolve('.dev/release/shared/server/files/mods').resolve(name).toFile())
            parent = parent.parent
        }
        def pinned = new File(projectRoot, '.gradle/pinned-mods')
        if (pinned.isDirectory()) pinned.eachDir { candidates.add(new File(it, name)) }
        for (File candidate : candidates) {
            if (candidate.isFile() && hash(candidate, pin.algorithm) == pin.hash) return candidate
        }
        File target = new File(modDir, name)
        target.parentFile.mkdirs()
        File temporary = new File(modDir, "${name}.download.tmp")
        try {
            // Single-shot downloads die on transient github.com 504s in CI (runs 42043834718,
            // 42054850560): the R2 CDN serves the same hash-addressed bytes as the pack mirror,
            // so it is tried before the github.com mirror. Bounded retries with backoff per URL,
            // then the hash check below still decides.
            IOException failed = null
            for (String url : [pin.url, CDN_MIRROR + pin.hash, MIRROR + pin.hash]) {
                for (int attempt = 1; attempt <= 3; attempt++) {
                    try {
                        def connection = new URL(url).openConnection()
                        if (connection instanceof java.net.HttpURLConnection) connection.instanceFollowRedirects = true
                        connection.connectTimeout = 30000
                        connection.readTimeout = 120000
                        connection.setRequestProperty('User-Agent', 'Blockfield-CI/1.0')
                        connection.setRequestProperty('Accept', '*/*')
                        if (connection instanceof java.net.HttpURLConnection
                                && (connection.responseCode < 200 || connection.responseCode >= 300)) {
                            throw new IOException("Server returned HTTP response code: ${connection.responseCode} for URL: ${url}")
                        }
                        connection.inputStream.withCloseable { input -> temporary.withOutputStream { it << input } }
                        failed = null
                        break
                    } catch (IOException downloadFailed) {
                        def transientFailure = (downloadFailed instanceof java.net.SocketTimeoutException)
                            || (downloadFailed instanceof java.net.ConnectException)
                            || (downloadFailed.message ==~ /Server returned HTTP response code: 5\d\d for URL: .*/)
                        if (!transientFailure || attempt >= 3) { failed = downloadFailed; break }
                        Thread.sleep(2000L * attempt)
                    }
                }
                if (failed == null) break
            }
            if (failed != null) throw failed
            if (hash(temporary, pin.algorithm) != pin.hash)
                throw new GradleException("Oracle pack checksum mismatch: ${name}")
            java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            return target
        } catch (IOException downloadFailed) {
            if (name != 'blockfield-music-7.jar') throw downloadFailed
            unavailable[name] = downloadFailed.toString()
            return null
        } finally { temporary.delete() }
    }
}

// SPEED-PAR pool for the parallel gates. Sized once, at the first pooled stage start:
// budget = MemAvailable - 2 GiB reserve (keeps the desktop and agents out of swap). A stage starts
// while the measured footprints (heap + non-heap) of the running stages and its own fit the budget,
// at most 4 at once; with uniform footprints that is N = clamp(floor(budget / footprint), 1, 4).
// One stage always runs even if it alone exceeds the budget. A stage's share returns when its task
// finishes in any way (completion listener), so a failed or timed-out stage never starves the rest.
abstract class ParallelGatePool implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None>,
        org.gradle.tooling.events.OperationCompletionListener {
    static final long RESERVE_MIB = 2048
    static final int MAX_STAGES = 4
    private long budget = -1
    private long used
    private final Map<String, Long> running = [:]
    private final Map<String, Long> waiting = [:]
    private String failed

    static void requireExclusive(String task) {
        if (System.getenv('BF_GRADLE_SLOT_EXCLUSIVE') != '1')
            throw new GradleException("${task}: the parallel oracle gates run their stage JVMs concurrently and need " +
                    'the whole machine. Run them through gradle-slot --exclusive (it exports BF_GRADLE_SLOT_EXCLUSIVE=1).')
    }

    synchronized void acquire(String task, long footprintMib, int maxWorkers, int pooledStages) {
        requireExclusive(task)
        if (budget < 0) {
            long available = new File('/proc/meminfo').readLines().find { it.startsWith('MemAvailable:') }
                    .tokenize()[1].toLong().intdiv(1024)
            budget = available - RESERVE_MIB
            println("parallel gate pool: budget = MemAvailable ${available} MiB - reserve ${RESERVE_MIB} MiB = ${budget} MiB;" +
                    " at most ${MAX_STAGES} stages at once")
            // A stage waiting here still holds its Gradle worker, so fewer workers than pooled stages
            // can leave a stage that would fit without a worker.
            if (maxWorkers < pooledStages)
                println("parallel gate pool: WARNING --max-workers ${maxWorkers} < ${pooledStages} pooled stages;" +
                        " run the gate with --max-workers=${pooledStages} or more")
        }
        // Any waiting stage that fits may start, smallest footprint first, so a large waiting stage
        // never blocks a smaller one that fits beside the running stages.
        waiting[task] = footprintMib
        try {
            while (failed == null && !mayStart(footprintMib)) wait()
            // Like the former dependsOn chain: no new stage starts after a stage failed.
            if (failed != null) throw new GradleException("${task}: not started, ${failed} failed")
        } finally {
            waiting.remove(task)
        }
        running[task] = footprintMib
        used += footprintMib
        notifyAll()
        println("parallel gate pool: ${task} starts (footprint ${footprintMib} MiB); ${running.size()} running, ${used} of ${budget} MiB")
    }

    // Plain loops, no closures: Gradle instantiates a decorated subclass, where Groovy closures
    // cannot see this class's private fields.
    boolean fits(long footprint) {
        return running.isEmpty() || (running.size() < MAX_STAGES && used + footprint <= budget)
    }

    boolean mayStart(long footprint) {
        if (!fits(footprint)) return false
        for (Long other : waiting.values()) {
            if (other < footprint && fits(other)) return false
        }
        return true
    }

    @Override
    synchronized void onFinish(org.gradle.tooling.events.FinishEvent event) {
        if (!(event instanceof org.gradle.tooling.events.task.TaskFinishEvent)) return
        Long footprint = running.remove(event.descriptor.taskPath)
        if (footprint != null) used -= footprint
        // Group checks are separate tasks too: any build failure must release waiting admissions.
        if (event.result instanceof org.gradle.tooling.events.task.TaskFailureResult && failed == null)
            failed = event.descriptor.taskPath
        notifyAll()
    }
}
abstract class ParallelGateEvents {
    @javax.inject.Inject
    abstract org.gradle.build.event.BuildEventsListenerRegistry getRegistry()
}

// Resume decisions are frozen before any stage mutates outputs. A completion receipt belongs to
// one successful JavaExec, and a group may read outputs only when every receipt is available.
class ParallelGateVerdicts {
    static final Map<String, Long> starts = new java.util.concurrent.ConcurrentHashMap<>()

    static void markStart(String stage) { starts.put(stage, System.nanoTime()) }

    static String durationOf(String stage) {
        Long start = starts.remove(stage)
        if (start == null) return '?'
        long seconds = (System.nanoTime() - start) / 1000000000L
        return "${seconds.intdiv(60)}m${seconds % 60}s"
    }

    static Map readVerdict(File file) {
        if (!file.isFile()) return null
        try { return new groovy.json.JsonSlurper().parse(file) as Map } catch (Exception ignored) { return null }
    }

    static void atomicWrite(File file, String text) {
        java.nio.file.Files.createDirectories(file.parentFile.toPath())
        def temporary = java.nio.file.Files.createTempFile(file.parentFile.toPath(), file.name, '.tmp')
        try {
            java.nio.file.Files.writeString(temporary, text)
            java.nio.file.Files.move(temporary, file.toPath(), java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally { java.nio.file.Files.deleteIfExists(temporary) }
    }

    static void writeRecord(File file, Map value) {
        atomicWrite(file, new groovy.json.JsonBuilder(value).toPrettyString())
    }

    static String[] gitInfo(String workDir) {
        def commitProc = new ProcessBuilder('git', '-C', workDir, 'rev-parse', 'HEAD').redirectErrorStream(true).start()
        def commit = commitProc.inputStream.getText('UTF-8').trim()
        if (commitProc.waitFor() != 0) throw new GradleException("cannot resolve gate commit: ${commit}")
        def statusProc = new ProcessBuilder('git', '-C', workDir, 'status', '--porcelain').redirectErrorStream(true).start()
        def status = statusProc.inputStream.getText('UTF-8')
        if (statusProc.waitFor() != 0) throw new GradleException("cannot resolve gate worktree status: ${status}")
        return [commit, status.trim().isEmpty() ? 'clean' : 'dirty']
    }

    static String inputsHash(String arguments, Map runtime) {
        def files = new LinkedHashSet<File>(runtime.files)
        def unavailable = runtime.unavailable.isFile() ? readVerdict(runtime.unavailable) : [:]
        runtime.packs.each { name ->
            def file = OracleRunnerMods.resolve(runtime.pins, runtime.projectRoot, runtime.modDir, unavailable, name)
            if (file != null) files.add(file)
        }
        def entries = []
        files.each { file ->
            if (file.isDirectory()) file.eachFileRecurse { child -> if (child.isFile()) entries.add(child) }
            else entries.add(file)
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        digest.update(arguments.getBytes('UTF-8'))
        entries.sort { it.absolutePath }.each { file ->
            digest.update(('\n' + file.absolutePath + '=' +
                    (file.isFile() ? OracleRunnerMods.hash(file, 'SHA-256') : 'missing')).getBytes('UTF-8'))
        }
        return digest.digest().encodeHex().toString()
    }

    static File completionFile(File root, String stage) { new File(root, ".completed-${stage}.json") }

    static boolean completed(Map receipt, String stage, Map build) {
        return receipt != null && receipt.id instanceof String && !receipt.id.isEmpty() && receipt.schema == 2 && receipt.stage == stage && receipt.result == 'PASS' &&
                receipt.commit == build.commit && receipt.inputsHash == build.inputs[stage] && receipt.dirty == build.dirty
    }

    static boolean accepted(File root, Map verdict, Map receipt, String stage, Map build) {
        def checked = verdict?.group == null ? null : readVerdict(new File(root, ".checked-${verdict.group}.json"))
        return checked != null && checked.id instanceof String && checked.completions instanceof Map &&
                checked.id == verdict.checkId && checked.completions[stage] == receipt?.id &&
                completed(receipt, stage, build) && verdict != null && verdict.schema == 2 &&
                verdict.stage == stage && verdict.result == 'PASS' && verdict.commit == build.commit &&
                verdict.inputsHash == build.inputs[stage] && verdict.dirty == build.dirty &&
                verdict.completionId == receipt.id
    }

    static void begin(File root, File buildFile, String workDir, boolean fresh, Map arguments, Map runtimes, List groups) {
        java.nio.file.Files.createDirectories(root.toPath())
        def info = gitInfo(workDir)
        def build = [id: UUID.randomUUID().toString(), commit: info[0], dirty: info[1] == 'dirty', inputs: [:], skipped: []]
        arguments.each { stage, args -> build.inputs[stage] = inputsHash(args, runtimes[stage]) }
        arguments.keySet().each { stage ->
            if (!fresh && !build.dirty && accepted(root, readVerdict(new File(root, "${stage}.json")),
                    readVerdict(completionFile(root, stage)), stage, build)) build.skipped.add(stage)
        }
        // Invalidate the whole affected group before any member starts, including old sibling PASSes.
        // Skipped siblings retain receipts, but an interrupted/failed group must be checked again.
        groups.findAll { group -> group.stages.any { arguments.containsKey(it) && !build.skipped.contains(it) } }.each { group ->
            java.nio.file.Files.deleteIfExists(new File(root, ".checked-${group.stages[0]}.json").toPath())
            group.stages.each { stage -> java.nio.file.Files.deleteIfExists(new File(root, "${stage}.json").toPath()) }
        }
        arguments.keySet().findAll { !build.skipped.contains(it) }.each { stage ->
            java.nio.file.Files.deleteIfExists(completionFile(root, stage).toPath())
        }
        writeRecord(buildFile, build)
    }

    static boolean shouldSkip(String stage, File buildFile) {
        return readVerdict(buildFile).skipped.contains(stage)
    }

    static void appendLine(File progress, String line) {
        synchronized (ParallelGateVerdicts) {
            java.nio.file.Files.createDirectories(progress.parentFile.toPath())
            if (!progress.isFile()) progress.text = '# anim-sync parallel gate progress\n'
            progress.append(line + '\n')
        }
    }

    static String tail(String text, int lines) {
        def split = text.readLines()
        return split.size() <= lines ? text : split[-lines..-1].join('\n')
    }

    static void runCheck(List arguments, String gateScript, List outputs) {
        def gateProc = new ProcessBuilder(['python3', gateScript] + arguments.collect { it.toString() }).redirectErrorStream(true).start()
        def gateOut = gateProc.inputStream.getText('UTF-8')
        if (gateProc.waitFor() != 0) {
            outputs.add("FAILED ${arguments[0]}: ${tail(gateOut, 40)}")
            throw new GradleException("anim_sync_parallel_gate.py failed (${arguments[0]}): ${tail(gateOut, 40)}")
        }
        outputs.add(tail(gateOut, 5))
    }

    static void completeStage(String stage, File root, File buildFile) {
        def build = readVerdict(buildFile)
        // JavaExec has exited successfully; all its output writes precede this atomic receipt.
        writeRecord(completionFile(root, stage), [schema: 2, id: UUID.randomUUID().toString(), run: build.id,
                stage: stage, result: 'PASS', commit: build.commit, inputsHash: build.inputs[stage], dirty: build.dirty])
    }

    // Called by a check task depending on every member: even a late stage action must succeed.
    // The JVM monitor also prevents overlapping FileLocks from simultaneous group checks.
    static synchronized void groupDone(Map group, File root, File progress,
            String gateScript, List tierStages, File buildFile) {
        def build = readVerdict(buildFile)
        new RandomAccessFile(new File(root, '.lock'), 'rw').withCloseable { raf ->
            def lock = raf.channel.lock()
            try {
                def receipts = group.stages.collectEntries { name -> [(name): readVerdict(completionFile(root, name))] }
                if (!group.stages.every { name -> completed(receipts[name], name, build) &&
                        (receipts[name].run == build.id || build.skipped.contains(name)) }) {
                    throw new GradleException("parallel gate ${group.kind}: missing successful stage completions")
                }
                def outputs = []
                def result = 'FAIL'
                def checkId = UUID.randomUUID().toString()
                try {
                    group.args.each { arguments -> runCheck(arguments as List, gateScript, outputs) }
                    result = 'PASS'
                } finally {
                    def finishedAt = java.time.Instant.now().toString()
                    group.stages.each { name ->
                        writeRecord(new File(root, "${name}.json"), [schema: 2, stage: name,
                                commit: build.commit, inputsHash: build.inputs[name], result: result,
                                completionId: receipts[name].id, group: group.stages[0], checkId: checkId,
                                checker: tail(outputs.join('\n'), 40),
                                finishedAt: finishedAt, dirty: build.dirty])
                    }
                    def done = tierStages.count { name -> accepted(root, readVerdict(new File(root, "${name}.json")),
                            readVerdict(completionFile(root, name)), name, build) }
                    if (result == 'PASS') done += group.stages.size()
                    group.stages.each { name ->
                        appendLine(progress, "${finishedAt} ${name} ${result} ${durationOf(name)} ${done}/${tierStages.size()}")
                    }
                    // Publish acceptance last: partial verdict/progress writes can never authorize reuse.
                    if (result == 'PASS') writeRecord(new File(root, ".checked-${group.stages[0]}.json"),
                            [id: checkId, completions: receipts.collectEntries { name, value -> [(name): value.id] }])
                }
            } finally { lock.release() }
        }
    }
}

def oracleJar = tasks.register('oracleJar', Jar) {
    dependsOn 'oracleTestClasses'
    archiveClassifier = 'oracle-named'
    from sourceSets.oracleTest.output
}
def remapOracle = tasks.register('remapOracleJar', tasks.named('remapJar').get().class.superclass) {
    dependsOn oracleJar
    inputFile = oracleJar.flatMap { it.archiveFile }
    archiveClassifier = 'oracle'
    addNestedDependencies = false
    classpath.from(sourceSets.oracleTest.compileClasspath)
}
// Versioned oracle fixtures for blockfield-server#318: the fixture classes the
// server oracleTest needs, plus their in-oracle deps (Fx* helpers). Compiled in
// named with the rest of oracleTest, remapped to intermediary below — the same
// namespace as the published common jar, so the server remaps/consumes it the
// same way. Test-only: never enters the client pack.
def oracleFixtureClasses = [
        'AnimationManifestCases',
        'FxClientCases', 'FxClientItems', 'FxPoseCases',
        'LrSelectorNativeCases', 'LrTransitionNativeCases', 'MixedRendererCases',
        'OracleFixtureRegistry', 'OracleProvenance',
        'OracleReflection', 'OracleTransformAudit',
        'PaGraphNativeCases', 'PaObserverNativeCases',
        'ParCoolNativeValues', 'ParCoolPresentationCases', 'ParCoolProjectionCases',
        'ParCoolStagesCases', 'ParCoolZiplineCases',
        'StanceEaseCases', 'WireReportVectors',
]
def oracleFixturesJar = tasks.register('oracleFixturesJar', Jar) {
    dependsOn 'oracleTestClasses'
    archiveBaseName = 'blockfield-oracle-fixtures'
    archiveClassifier = 'named'
    oracleFixtureClasses.each { name ->
        from(sourceSets.oracleTest.output) { include "com/lunares/blockfield/oracle/${name}*.class" }
