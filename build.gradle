ext.pinnedMod = { String id ->
    def mod = pinnedMods[id]
    def dir = new File(pinnedCacheDir, mod.sha256)
    def jar = new File(dir, URLDecoder.decode(mod.url.substring(mod.url.lastIndexOf('/') + 1), 'UTF-8'))
    def upstream = new File(dir, 'upstream.jar')
    def sha256 = { File f ->
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        f.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) { digest.update(buffer, 0, count) }
        }
        digest.digest().encodeHex().toString()
    }
    def download = { String url, File target ->
        // github.com release downloads 302 to the release CDN and transiently answer 504
        // in CI (run 42043834718): bounded retries with backoff, then the sha256 check
        // below still decides. Redirects are followed explicitly; 404 is never retried.
        IOException failed = null
        for (int attempt = 1; attempt <= 3; attempt++) {
            try {
                def connection = new URL(url).openConnection()
                if (connection instanceof java.net.HttpURLConnection) connection.instanceFollowRedirects = true
                connection.connectTimeout = 30000
                connection.readTimeout = 120000
                connection.setRequestProperty('User-Agent', 'Blockfield-CI/1.0')
                connection.setRequestProperty('Accept', '*/*')
                if (connection instanceof java.net.HttpURLConnection
                        && (connection.responseCode < 200 || connection.responseCode >= 300)) {
                    throw new IOException("Server returned HTTP response code: ${connection.responseCode} for URL: ${url}")
                }
                connection.inputStream.withCloseable { input ->
                    target.withOutputStream { output -> output << input }
                }
                return
            } catch (IOException e) {
                failed = e
                def transientFailure = (e instanceof java.net.SocketTimeoutException)
                    || (e instanceof java.net.ConnectException)
                    || (e.message ==~ /Server returned HTTP response code: 5\d\d for URL: .*/)
                if (!transientFailure || attempt >= 3) throw e
                Thread.sleep(2000L * attempt)
            }
        }
        throw failed
    }
    if (!upstream.isFile() || sha256(upstream) != mod.sha256) {
        dir.mkdirs()
        def tmp = File.createTempFile('download', '.tmp', dir)
        try {
            if (mod.archiveEntry) {
                // CI preserves this cache across clean checkouts; downloading the whole pack is only needed once.
                def archive = new File(pinnedCacheDir, "${mod.archiveSha256}.zip")
                if (!archive.isFile() || sha256(archive) != mod.archiveSha256) {
                    archive.parentFile.mkdirs()
                    def archiveTmp = File.createTempFile("${mod.archiveSha256}.", '.tmp', archive.parentFile)
                    try {
                        download(mod.archiveUrl, archiveTmp)
                        def got = sha256(archiveTmp)
                        if (got != mod.archiveSha256) { throw new GradleException("${mod.archiveUrl}: sha256 ${got}, expected ${mod.archiveSha256}") }
                        java.nio.file.Files.move(archiveTmp.toPath(), archive.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                    } finally { archiveTmp.delete() }
                }
                new java.util.zip.ZipFile(archive).withCloseable { zip ->
                    def entry = zip.getEntry(mod.archiveEntry)
                    if (entry == null || entry.isDirectory()) { throw new GradleException("${mod.archiveUrl}: missing file ${mod.archiveEntry}") }
                    zip.getInputStream(entry).withCloseable { input ->
                        tmp.withOutputStream { output -> output << input }
                    }
                }
            } else {
                // A CDN copy (mirrorUrl) is tried first when present: it serves bytes the sha256
                // check below verifies, so CI no longer depends on the github.com release endpoint.
                // Either URL keeps the bounded 5xx retry inside download; 404 on the first falls
                // through to the second, and the checksum still decides.
                IOException failed = null
                for (String url : (mod.mirrorUrl ? [mod.mirrorUrl, mod.url] : [mod.url])) {
                    try { download(url, tmp); failed = null; break }
                    catch (IOException e) { failed = e }
                }
                if (failed != null) throw failed
            }
            def got = sha256(tmp)
            if (got != mod.sha256) { throw new GradleException("${mod.url}: sha256 ${got}, expected ${mod.sha256}") }
            // The directory is keyed by sha256, so a replaced upstream is byte-identical: never delete a JAR
            // another checkout may have just staged and returned.
            java.nio.file.Files.move(tmp.toPath(), upstream.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        } finally { tmp.delete() }
    }
    // A stripped JAR has no pinned hash, so its own is recorded beside it: every checkout shares this copy,
    // and a damaged or swapped one must be rebuilt from the verified upstream rather than silently reused.
    def recorded = new File(dir, "${jar.name}.sha256")
    def expected = !mod.stripLoomVersion ? mod.sha256 : recorded.isFile() ? recorded.text : ''
    if (!jar.isFile() || sha256(jar) != expected) {
        // Another checkout may be reading this shared JAR: stage it and rename it into place.
        def staged = File.createTempFile('jar', '.tmp.jar', dir)
        def stagedHash = File.createTempFile('jar', '.tmp.sha256', dir)
        try {
            java.nio.file.Files.copy(upstream.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (mod.stripLoomVersion) {
                java.nio.file.FileSystems.newFileSystem(staged.toPath()).withCloseable { fs ->
                    def mf = fs.getPath('META-INF/MANIFEST.MF')
                    java.nio.file.Files.writeString(mf, java.nio.file.Files.readString(mf).replaceAll(/(?m)^Fabric-Loom-Version:.*\r?\n/, ''))
                }
                stagedHash.text = sha256(staged)
            }
            java.nio.file.Files.move(staged.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            if (mod.stripLoomVersion) {
                java.nio.file.Files.move(stagedHash.toPath(), recorded.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            }
        } finally { staged.delete(); stagedHash.delete() }
    }
    return jar
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'fabric-loom'
    apply plugin: 'idea'

    group = mod_group_id
    version = "${mod_version}+mc${minecraft_version}"

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    if (name == 'client') {
        sourceSets.test.java.srcDir rootProject.file('dev/test')
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
        maven { url = 'https://maven.wispforest.io' }
        maven { url = 'https://maven.nucleoid.xyz' }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.enginehub.org/repo/' } }
            filter { includeGroup 'com.sk89q.worldedit'; includeGroup 'com.sk89q.worldedit.worldedit-libs'; includeGroup 'org.enginehub'; includeGroup 'org.enginehub.piston'; includeGroup 'org.enginehub.lin-bus'; includeGroupByRegex 'org\\.enginehub\\..*' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    }

    // Одинаковые исходники -> одинаковый jar: bump-mod.sh оставляет клиентский пин, если клиент не менялся.
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.register('lintJava', JavaCompile) {
        dependsOn 'classes'
        source sourceSets.main.allJava, sourceSets.test.allJava
        classpath = sourceSets.main.compileClasspath + sourceSets.test.compileClasspath
        destinationDirectory = layout.buildDirectory.dir('classes/java/lint')
        options.annotationProcessorPath = files()
        // Mixin processor diagnostics stay in normal compilation. The existing Accessories API has
        // removal deprecations; this gate fails only actionable javac control-flow warnings.
        options.compilerArgs += ['-proc:none', '-Xlint:divzero,empty,fallthrough,finally,-removal', '-Werror']
    }

    tasks.named('check') {
        dependsOn rootProject.tasks.named('spotlessCheck'), tasks.named('lintJava')
    }

    tasks.named('processResources', ProcessResources).configure {
        // Локальные копии: expand выполняется в execution и не должен трогать project.
        def projVersion = project.version
        def modIdValue = mod_id
        def modNameValue = mod_name
        def modLicenseValue = mod_license
        def modVersionValue = mod_version
        def modAuthorsValue = mod_authors
        def modDescriptionValue = mod_description
        def minecraftVersionValue = minecraft_version
        inputs.property 'version', projVersion
        inputs.property 'mod_version', modVersionValue
        inputs.property 'git_commit', gitCommit
        filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
            expand([
                    version          : projVersion,
                    mod_id           : modIdValue,
                    mod_name         : modNameValue,
                    mod_license      : modLicenseValue,
                    mod_version      : modVersionValue,
                    mod_authors      : modAuthorsValue,
                    mod_description  : modDescriptionValue,
                    minecraft_version: minecraftVersionValue,
                    git_commit       : gitCommit.get(),
            ])
        }
    }
}

// Common classes are copied into both jars; their shadow names need the same AP mappings.
gradle.projectsEvaluated {
    [project(':client')].each { side ->
        side.tasks.named('remapJar') {
            def common = project(':common')
            dependsOn common.tasks.named('compileJava')
            def options = tinyRemapperServiceOptions.get()
            options.mixinApMappings.add(net.fabricmc.loom.task.service.MixinAPMappingService.createOptions(
                    common, common.sourceSets.main, sourceNamespace, targetNamespace))
            tinyRemapperServiceOptions.set(options)
        }
    }
}

apply from: 'dev/pinned-mod-self-check.gradle'
subprojects.each { subproject ->
    subproject.tasks.named('test').configure {
        dependsOn rootProject.tasks.named('checkPinnedMod')
    }
}
