plugins {
    id 'idea'
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    id 'com.diffplug.spotless' version '7.2.1'
}

repositories { mavenCentral() }

spotless {
    java {
        target 'common/src/**/*.java', 'client/src/**/*.java',
                'dev/test/**/*.java', 'dev/oracleTest/**/*.java'
        googleJavaFormat('1.36.1').aosp()
    }
}

// Коммит, из которого собран jar: /bf version и build.json показывают его в рантайме.
// Без времени сборки: одинаковый коммит -> одинаковый jar.
// Ленивый ValueSource: git опрашивается только в execution (processResources expand
// и task input), а не в configuration, — иначе CC считал бы вывод git своим входом.
abstract class GitCommitValueSource implements ValueSource<String, GitCommitValueSource.Params> {
    interface Params extends ValueSourceParameters {
        DirectoryProperty getWorkingDir()
    }

    @Override
    String obtain() {
        try {
            def git = { String... args ->
                def process = new ProcessBuilder(['git'] + args.toList())
                        .directory(parameters.workingDir.asFile.get()).start()
                def out = process.inputStream.getText('UTF-8').trim()
                process.waitFor()
                return out
            }
            def rev = git('rev-parse', '--short=10', 'HEAD')
            def dirty = git('status', '--porcelain', '--untracked-files=no')
            return rev + (dirty ? '-dirty' : '')
        } catch (ignored) { return 'unknown' }
    }
}

def gitCommit = providers.of(GitCommitValueSource) {
    parameters { workingDir.set(rootDir) }
}

// One content-addressed cache for every checkout: each worktree used to keep its own copy of the JARs and
// of the 430 MB client archive behind lrTactical. CI keeps the path its actions/cache restores.
def pinnedCacheDir = System.getenv('CI') ? new File(rootDir, '.cache/quality/pinned-mods')
        : new File(gradle.gradleUserHomeDir, 'caches/blockfield-pinned-mods')

