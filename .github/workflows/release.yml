# Релизный workflow: тег vX.Y.Z (= mod_version в gradle.properties) -> тесты + сборка ->
# GitHub Release с client jar, версионированным common-артефактом
# (blockfield-common-<version>.jar + SHA256SUMS, immutable на версию: существующий
# релиз decide пропускает, gh release create не перезаписывает). Клиент закрепляет
# jar этого тега (Blockfield/blockfield-client: mods/blockfield-client.pw.toml); server jar
# собирается и публикуется из blockfield-server (mod-server/).
# Теги читают кэш main, который сохраняет quality.yml после проверки каждого изменения.
# Push в main с новым mod_version публикует релиз сам: если quality.yml уже успешно проверил
# это же дерево, тесты не повторяются (только сборка jar). Ручной push тега — запасной
# путь с той же проверкой покрытия: tested tree собирает jar, остальное идёт полным путём.
name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read # release-text reads the merged pull requests of the range
  actions: read # main-push path looks up the tested quality run for this tree
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Cheap resolve/scope decision on a free runner: no-op pushes (tag already
  # published, version already released) never occupy a paid Blacksmith runner.
  # Paid minutes (~85 wall-min/mo of pure no-op resolves) are a budget; the
  # resolve logic is byte-identical to the old in-job step, just moved here.
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      proceed: ${{ steps.ver.outputs.proceed }}
      full: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.publish }}
      jars: ${{ steps.ver.outputs.jars }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version and test coverage
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=""
          proceed=false
          full=false
          publish=false
          jars=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
            if gh release view "$version" >/dev/null 2>&1; then
              echo "Release $version already exists; nothing to do."
            else
              # Same trust as the main-push path below: a tree quality.yml
              # already fully checked needs jars only, not a second full run.
              # Anything else (including an unknown tree) runs full tests.
              tree=$(git rev-parse "HEAD^{tree}")
              tested=false
              for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].head_sha'); do
                t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
                if [ "$t" = "$tree" ]; then tested=true; break; fi
              done
              if [ "$tested" != true ]; then
                for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=pull_request&status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
                  if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
                done
              fi
              proceed=true
              publish=true
              if [ "$tested" = true ]; then
                echo "Tree $tree already tested; building jars only."
                jars=true
              else
                full=true
              fi
            fi
          elif [ "${GITHUB_REF_NAME}" != main ]; then
            echo "Manual run: tests only, no publish."
            proceed=true
            full=true
          else
            v=$(sed -n 's/^mod_version=//p' gradle.properties)
            version="v$v"
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${version}" --silent; then
              echo "Tag $version already exists; nothing to do."
            else
              tree=$(git rev-parse "HEAD^{tree}")
              tested=false
              for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].head_sha'); do
                t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
                if [ "$t" = "$tree" ]; then tested=true; break; fi
              done
              # PR runs test the merge ref, whose tree differs from head_sha when
              # the PR was behind main; those runs record tested-tree-<tree>.
              if [ "$tested" != true ]; then
                for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=pull_request&status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
                  if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
                done
              fi
              proceed=true
              publish=true
              if [ "$tested" = true ]; then
                echo "Tree $tree already tested; building jars only."
                jars=true
              else
                full=true
              fi
            fi
          fi
          {
            echo "version=$version"
            echo "proceed=$proceed"
            echo "full=$full"
            echo "publish=$publish"
            echo "jars=$jars"
          } >> "$GITHUB_OUTPUT"
  release:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    env:
      # Full-pack oracle, U10 and wire gates run locally before release.
      BF_SKIP_ORACLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag must match mod_version
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^mod_version=//p' gradle.properties)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != mod_version $v"; exit 1; }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: just check
        if: needs.decide.outputs.full == 'true'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: just test
        if: needs.decide.outputs.full == 'true'
      - run: just java-check
        if: needs.decide.outputs.full == 'true'
      - name: Build jars (tree already tested, no test re-run)
        if: needs.decide.outputs.jars == 'true'
        run: just gradle --no-daemon --max-workers=2 assemble :client:remapJar :common:remapJar
      - name: Release text
        if: needs.decide.outputs.publish == 'true'
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@2f20c9e9f66ddf63fbb59196c1ab69cfe30356d2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: release
          version: ${{ needs.decide.outputs.version }}
          kind: mod
          out-dir: dist
      - name: Publish release
        if: needs.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.decide.outputs.version }}"
          mkdir -p dist
          # Full path already ran java-check (build); the jars-only path built
          # :common:remapJar above. Rebuild here only when the jar is missing.
          common_built=false
          for jar in common/build/libs/blockfield-common-*.jar; do
            if [ -e "$jar" ]; then common_built=true; fi
          done
          if [ "$common_built" != true ]; then
            just gradle --no-daemon --max-workers=2 :common:remapJar
          fi
          cp client/build/libs/blockfield-client-*.jar dist/
          cp common/build/libs/blockfield-common-*.jar dist/
          rm -f dist/*-sources.jar dist/blockfield-common-*-dev.jar
          (cd dist && sha256sum -- *.jar > SHA256SUMS)
          gh release create "$version" --target "$GITHUB_SHA" --title "blockfield $version" --notes-file dist/release-notes.md dist/*
