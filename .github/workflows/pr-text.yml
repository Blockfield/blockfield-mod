# Пустое описание нового PR заполняется по diff и коммитам; любой сбой ничего не меняет.
name: PR text
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  text:
    # The next->main release PR aggregates already-reviewed work; rewriting its
    # body would bury the per-feature notes, so release-text skips it.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'next'
    # Tiny LLM-call job: GitHub-hosted is enough, keep Blacksmith for Gradle/Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: Blockfield/blockfield-workspace/.github/actions/release-text@2f20c9e9f66ddf63fbb59196c1ab69cfe30356d2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: pr
