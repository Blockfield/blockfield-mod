name: Code quality
on:
  push:
    branches: [main]
  # Bot-gate (enforcing): PR CI runs only when the GitHub App
  # `blockfield-review-bot[bot]` approves the CURRENT head SHA. Pushes to a PR
  # branch fire no workflow run at all; only the bot's `pull_request_review`
  # (submitted) on the new head starts CI. A stale approval (push between the
  # review and the run) is rejected by the commit_id == head SHA check below.
  # Draft PRs get no bot verdict, so no CI runs until the PR is marked ready.
  # Merge protection pairs this gate with the bot's own `bot-review` commit
  # status on the head SHA (success = approved, failure = changes requested):
  # require `bot-gate` + `check` + `bot-review` on main (see task report).
  # Merge-tree note: review runs test the head tree, not the merge ref. That
  # is safe only paired with branch protection "require up to date" (an
  # up-to-date merge == the head tree) plus the main-push same-tree check,
  # which runs full CI whenever a merge produces a tree no green PR run
  # tested.
  pull_request_review:
    types: [submitted]
  # Maintainer-only manual override (no bot verdict needed): run it from the
  # PR branch and record why. Ordinary contributors cannot bypass the gate
  # with this; misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
permissions:
  contents: read
  actions: read # decide job looks up the green quality run for this tree
  pull-requests: read # bot-gate reads blockfield-review-bot verdicts on the head SHA
concurrency:
  group: quality-${{ github.ref }}
  # Nothing cancels: main pushes deliberately do NOT cancel (a version-only
  # successor could otherwise certify a cancelled, untested predecessor:
  # assemble_only skips tests, release then publishes jars), and a review
  # must never cancel the run it gates. Queued runs each evaluate their own
  # event's head SHA and attach there, so a stale-head run can never report
  # green on the current head. Cost: superseded PR runs now queue instead of
  # cancelling (see mod-ci-waste.md §2).
  cancel-in-progress: false
jobs:
  # Cheap skip/scope decision on a free runner: already-tested main pushes
  # never occupy a paid Blacksmith runner.
  bot-gate:
    # Enforcing: `check` runs on a PR head only when this job reports
    # verdict=permit with sha_match=true for the CURRENT head SHA, resolved
    # from the API at gate runtime (a push may have landed after the
    # triggering review event was created; the event payload would still name
    # the old head). The event head must equal the runtime head, and the
    # bot's latest verdict-bearing review on that SHA must be APPROVED.
    # Anything else (stale event, no verdict yet, REQUEST_CHANGES, DISMISSED,
    # a verdict on an older SHA) skips `check`, so the gate fails closed.
    # Always exits 0: denial is expressed through the outputs, and the bot's
    # own `bot-review` commit status blocks merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request_review'
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      sha_match: ${{ steps.gate.outputs.sha_match }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Evaluate blockfield-review-bot verdict for the current PR head SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          bot='blockfield-review-bot[bot]'
          repo="${{ github.repository }}"
          # Current head, not the event snapshot: the review that triggered
          # this run may predate a newer push. Only the still-current head
          # may pass; a stale event waits for the newer review's run.
          HEAD_SHA=$(gh api "repos/$repo/pulls/$PR_NUMBER" --jq '.head.sha')
          verdict=deny-awaiting
          sha_match=false
          if [ "$EVENT_SHA" = "$HEAD_SHA" ]; then
            # Latest verdict-bearing bot review on the current head,
            # aggregated across API pages (gh --jq applies per page).
            # COMMENTED reviews carry no verdict and are excluded, so a later
            # comment cannot override an earlier verdict. (jq is preinstalled
            # on the runner. The head SHA is spliced in; gh --jq takes no
            # variable arguments.)
            state=$(gh api "repos/$repo/pulls/$PR_NUMBER/reviews" --paginate               --jq '[.[] | select(.user.login == "'"$bot"'" and .commit_id == "'"$HEAD_SHA"'")]'               | jq -r -s '[add[] | select(.state != "COMMENTED")] | sort_by(.id) | last | .state // empty')
            # The API returns uppercase states ("APPROVED"); normalize anyway.
            state=$(printf '%s' "$state" | tr '[:lower:]' '[:upper:]')
            case "$state" in
              APPROVED)
                verdict=permit
                sha_match=true
                ;;
              # CHANGES_REQUESTED -> deny; DISMISSED / empty stay
              # deny-awaiting (fail-closed).
              CHANGES_REQUESTED) verdict=deny ;;
            esac
          fi
          # `sha` always names the evaluated runtime head so logs and the
          # checkout below agree on what was gated.
          echo "event=${EVENT_SHA:0:12} head=${HEAD_SHA:0:12} bot_state=${state:-none} verdict=$verdict sha_match=$sha_match"
          {
            echo "verdict=$verdict"
            echo "sha_match=$sha_match"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested: ${{ steps.same.outputs.tested }}
      java: ${{ steps.scope.outputs.java }}
      assemble_only: ${{ steps.scope.outputs.assemble_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Gradle runs unless every changed file is known not to feed the Java build; unknown bases run it.
      - name: Determine Java scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          java=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            java=false
            for f in $(git diff --name-only "$BASE_SHA" HEAD); do
              case "$f" in
                .github/workflows/quality.yml | dev/quality.py | scripts/toolchain.py) java=true ;;
                *.md | docs/* | release-notes/* | .github/* | *.py | *.sh) ;;
                *) java=true ;;
              esac
            done
          fi
          echo "java=$java" >> "$GITHUB_OUTPUT"
          # Version-only diffs (only the mod_version= line in gradle.properties changes)
          # need jars rebuilt, not tests: run assemble only. Fail closed — anything
          # else, including an unknown base, leaves assemble_only=false.
          assemble_only=false
          if [ "$(git diff --name-only "$BASE_SHA" HEAD)" = "gradle.properties" ]; then
            changed=$(git diff "$BASE_SHA" HEAD -- gradle.properties | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^[+-]mod_version='; then
              assemble_only=true
            fi
          fi
          echo "assemble_only=$assemble_only" >> "$GITHUB_OUTPUT"
      # Main pushes usually merge a tree a green PR run already tested; re-testing
      # the identical tree wastes a full run (release.yml trusts the same lookup).
      # Review runs check out the head SHA, so head_sha's tree is the tested tree.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          tested=false
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.event == "push") | .head_sha'); do
            t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
            if [ "$t" = "$tree" ]; then tested=true; break; fi
          done
          if [ "$tested" != true ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
            done
          fi
          echo "Same tree $tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
  check:
    needs: [decide, bot-gate]
    # `always()` keeps push CI working even though `bot-gate` is skipped on
    # push; review heads additionally need the gate permit on the exact SHA.
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.bot-gate.outputs.verdict == 'permit' && needs.bot-gate.outputs.sha_match == 'true')) && needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Full-pack oracle, U10 and wire gates run locally before release.
      BF_SKIP_ORACLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && needs.bot-gate.outputs.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Python, shell and workflow lint and format
        run: just check
      - if: needs.decide.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Python and pure Java regression tests
        if: needs.decide.outputs.assemble_only != 'true'
        run: just test
      - name: Version-only assemble
        if: needs.decide.outputs.assemble_only == 'true'
        run: just gradle assemble --max-workers=2
      - if: needs.decide.outputs.java == 'true' && needs.decide.outputs.assemble_only != 'true'
        name: Java format, compiler lint and JUnit tests
        run: just java-check
      # Failures only: passing runs filled the org artifact quota for a week each.
      - name: Java test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports
          path: |
            client/build/test-results/
            client/build/reports/tests/
          retention-days: 7
      # Records the exact tree this green run tested. Main-push
      # and release lookups match it, so a merge skips even when the PR branch
      # itself was behind a main that has not moved since. Tiny file, short-lived.
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
