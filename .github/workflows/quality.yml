name: Code quality
on:
  push:
    branches: [main]
  # PR CI starts on push to the PR branch: no bot approval needed to run.
  # The bot still posts its own `bot-review` commit status, which merge
  # protection may require alongside `check` (see task report).
  # Merge-tree note: PR runs test the prospective merge commit, so a merge
  # whose tree a green PR run already tested is picked up by the main-push
  # same-tree check below; anything else runs full CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths-ignore: a docs-only PR must still create a run so the required
    # `check` reports; `decide` scopes the Java jobs out instead.
  # Maintainer-only manual run: run it from the PR branch and record why.
  # Misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
permissions:
  contents: read
  actions: read # decide job looks up the green quality run for this tree
  pull-requests: read # decide job reads the PR base SHA for Java scoping
concurrency:
  group: quality-${{ github.ref }}
  # PR pushes cancel superseded runs. Main pushes deliberately do NOT cancel
  # (a version-only successor could otherwise certify a cancelled, untested
  # predecessor: assemble_only skips tests, release then publishes jars).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Cheap skip/scope decision on a free runner: already-tested main pushes
  # never occupy a full CI runner.
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested: ${{ steps.same.outputs.tested }}
      java: ${{ steps.scope.outputs.java }}
      assemble_only: ${{ steps.scope.outputs.assemble_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Gradle runs unless every changed file is known not to feed the Java build; unknown bases run it.
      - name: Determine Java scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          java=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            java=false
            for f in $(git diff --name-only "$BASE_SHA" HEAD); do
              case "$f" in
                .github/workflows/quality.yml | dev/quality.py | scripts/toolchain.py) java=true ;;
                *.md | docs/* | release-notes/* | .github/* | *.py | *.sh) ;;
                *) java=true ;;
              esac
            done
          fi
          echo "java=$java" >> "$GITHUB_OUTPUT"
          # Version-only diffs (only the mod_version= line in gradle.properties changes)
          # need jars rebuilt, not tests: run assemble only. Fail closed — anything
          # else, including an unknown base, leaves assemble_only=false.
          assemble_only=false
          if [ "$(git diff --name-only "$BASE_SHA" HEAD)" = "gradle.properties" ]; then
            changed=$(git diff "$BASE_SHA" HEAD -- gradle.properties | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^[+-]mod_version='; then
              assemble_only=true
            fi
          fi
          echo "assemble_only=$assemble_only" >> "$GITHUB_OUTPUT"
      # Main pushes usually merge a tree a green PR run already tested; re-testing
      # the identical tree wastes a full run (release.yml trusts the same lookup).
      # PR runs check out the prospective merge commit, so its tree is the tested tree.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          tested=false
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.event == "push") | .head_sha'); do
            t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
            if [ "$t" = "$tree" ]; then tested=true; break; fi
          done
          if [ "$tested" != true ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
            done
          fi
          echo "Same tree $tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
  # Fast, secret-free signal (~1 min): lint and format checks incl. GJF.
  # Runs beside the Gradle jobs instead of serially before them. Needs Java:
  # format-check verifies Java files against google-java-format.
  lint:
    needs: [decide]
    # PR heads, pushes and maintainer dispatches all run (subject to the
    # decide job's same-tree skip); `always()` keeps the job alive when
    # `decide` is skipped.
    if: always() && needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Python, shell and workflow lint and format
        run: just check
  # Python rig tests plus the client oracle (`:client:oracleTest`): the long
  # pole on changes that feed the Java build. Separate runner from java-check
  # so the two Gradle invocations overlap instead of stacking.
  test:
    needs: [decide]
    # Same run conditions as lint.
    if: always() && needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Cache fetched mod jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality/pinned-mods
            .gradle/oracle-mods
          # Keyed by the pin files: a pin bump refetches, hits reuse verified jars.
          key: oracle-mods-v1-${{ runner.os }}-${{ hashFiles('dev/oracle-mod-pins.gradle', 'build.gradle') }}
          restore-keys: |
            oracle-mods-v1-${{ runner.os }}-
          # Save even when tests fail: without this a red run (e.g. 42050909939) stores
          # nothing and the next run refetches every jar. Cached files are hash-verified.
          save-always: true
      - if: needs.decide.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Python and pure Java regression tests
        if: needs.decide.outputs.assemble_only != 'true'
        run: just test
      - name: Version-only assemble
        if: needs.decide.outputs.assemble_only == 'true'
        run: just gradle assemble --max-workers=2
  # Spotless, javac lint and JUnit: overlaps the oracle run above.
  java:
    needs: [decide]
    # Skipped for version-only pushes (assemble covers them) and for changes
    # outside the Java scope, exactly as the old serial step was.
    if: always() && needs.decide.outputs.tested != 'true' && needs.decide.outputs.java == 'true' && needs.decide.outputs.assemble_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Cache fetched mod jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality/pinned-mods
            .gradle/oracle-mods
          # Keyed by the pin files: a pin bump refetches, hits reuse verified jars.
          key: oracle-mods-v1-${{ runner.os }}-${{ hashFiles('dev/oracle-mod-pins.gradle', 'build.gradle') }}
          restore-keys: |
            oracle-mods-v1-${{ runner.os }}-
          # Save even when tests fail: without this a red run (e.g. 42050909939) stores
          # nothing and the next run refetches every jar. Cached files are hash-verified.
          save-always: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Java format, compiler lint and JUnit tests
        run: just java-check
      # Failures only: passing runs filled the org artifact quota for a week each.
      - name: Java test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports
          path: |
            client/build/test-results/
            client/build/reports/tests/
          retention-days: 7
  # Single required status for branch protection: records the tested tree only
  # when decide, lint, test and (if in scope) java are all green (a lint-only green must never
  # certify a tree whose tests failed).
  check:
    needs: [decide, lint, test, java]
    if: always() && needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require green decide, lint, test and java
        env:
          DECIDE: ${{ needs.decide.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          JAVA: ${{ needs.java.result }}
          JAVA_WANTED: ${{ needs.decide.outputs.java == 'true' && needs.decide.outputs.assemble_only != 'true' }}
        run: |
          # `skipped` is fine only for java, and only when decide succeeded and scoped it out.
          [ "$DECIDE" = success ] || { echo "::error::decide result: $DECIDE"; exit 1; }
          [ "$LINT" = success ] || { echo "::error::lint result: $LINT"; exit 1; }
          [ "$TEST" = success ] || { echo "::error::test result: $TEST"; exit 1; }
          if [ "$JAVA_WANTED" = true ]; then want=success; else want=skipped; fi
          [ "$JAVA" = "$want" ] || { echo "::error::java result: $JAVA, expected $want"; exit 1; }
      # Records the exact tree this green run tested. Main-push
      # and release lookups match it, so a merge skips even when the PR branch
      # itself was behind a main that has not moved since. Tiny file, short-lived.
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
